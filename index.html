<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外研版九年级上英语课外辅导工作台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Waiyan / NSE Grade 9A Tutor Console</p>
      <h1>外研版初三上英语课外辅导工作台</h1>
      <p class="subtitle">以外研版九年级上册常见模块主题为基准，重组每单元教学重难点、核心词汇、语法讲解与配套练习，供课外辅导老师备课、诊断和布置作业使用。</p>
    </div>
    <div class="hero-card">
      <strong>使用建议</strong>
      <span>先用“模块总览”定位学生薄弱点，再切换模块查看词汇、语法和习题。所有例句与练习均为原创，避免替代教材原文。</span>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="筛选工具">
      <label>
        搜索模块 / 词汇 / 语法
        <input id="searchInput" type="search" placeholder="如：被动语态、wonder、Module 6" />
      </label>
      <label>
        模块筛选
        <select id="moduleFilter">
          <option value="all">全部模块</option>
        </select>
      </label>
      <button id="resetBtn" type="button">重置</button>
    </section>

    <section class="overview">
      <h2>模块总览</h2>
      <div id="overviewGrid" class="overview-grid"></div>
    </section>

    <section class="workspace">
      <aside>
        <h2>模块导航</h2>
        <nav id="moduleNav" class="module-nav"></nav>
      </aside>
      <section id="moduleDetails" class="details" aria-live="polite"></section>
    </section>
  </main>

  <footer>
    <p>© 2026 Tutor Workbench · 内容定位为教辅工作台：概括课标能力、原创例句与原创习题。</p>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
